name: Generate GitHub Metrics

# 1. DISPARADORES (Triggers)
on:
  schedule:
    # Invierno PT1 (Enero a Marzo): 22:50 UTC = 23:50 España
    - cron: "50 22 * 1-3 *"
    # Verano (Abril a Octubre): 21:50 UTC = 23:50 España
    - cron: "50 21 * 4-10 *"
    # Invierno PT2 (Noviembre y Diciembre): 22:50 UTC = 23:50 España
    - cron: "50 22 * 11-12 *"
  workflow_dispatch:      # Habilita el botón manual "Run workflow" en la pestaña Actions para probarlo sin esperar
  push:
    branches: ["main", "master"]    # Se ejecuta también cada vez que hagas push a tu rama principal

# 2. DEFINICIÓN DEL JOB Y PERMISOS
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Permite a la acción hacer commit y push del SVG generado en tu repositorio
    steps:
      - name: General metrics
        uses: lowlighter/metrics@latest
        with:
          # 3. AUTENTICACIÓN Y CONFIGURACIÓN BASE
          token: ${{ secrets.METRICS_TOKEN }}      # Lee el secret que acabas de guardar
          user: antonioabadpro                     # Tu usuario de GitHub
          template: classic                        # Plantilla base estructurada
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Madrid           # Ajusta los cálculos de actividad diaria a tu zona horaria
          
          # 4. PLUGIN DE LÍNEAS DE CÓDIGO Y ACTIVIDAD
          plugin_lines: yes                        # Calcula líneas añadidas y eliminadas
          plugin_activity: no                      # Desactivado para evitar errores de timeline

          # 5. PLUGIN DE LENGUAJES (Barra limpia idéntica a la de referencia)
          plugin_languages: yes                    # Activa el desglose de lenguajes
          plugin_languages_details: ""             # Vacío para no mostrar la lista de puntos debajo
          plugin_languages_limit: 8                # Muestra los 8 lenguajes principales en la barra
          plugin_languages_sections: most-used
          
          # 6. ESTRUCTURA 3D + RÉCORDS (Calcula el 3D y las medias/rachas a la derecha)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 7. HÁBITOS INDEPENDIENTES DESACTIVADOS (Elimina el error rojo)
          plugin_habits: no
          
          # 8. GUARDADO Y COMMIT AUTOMÁTICO
          output_action: commit                    # Realiza el commit directo en el repositorio
          committer_message: "build: update github metrics [skip ci]" # Mensaje de commit (con [skip ci] para evitar bucles infinitos)